<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the canvas so mobile browser chrome blends into the page -->
    <meta name="theme-color" content="#dbe4f1" />

    <!--
      Fonts are linked here rather than @imported from index.css. An @import
      inside the stylesheet cannot start downloading until the stylesheet itself
      has parsed, which serialises two render-blocking round trips.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/eventive-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://eventive.co.zw/" />

    <title>Eventive — Events Logistics & Equipment Hire, Zimbabwe</title>
    <meta
      name="description"
      content="Full-service events management, marquee hire, sound, lighting, power and catering across Zimbabwe. Owned inventory, no sub-hires. Harare, Bulawayo, Victoria Falls, Nyanga, Selous."
    />

    <meta property="og:site_name" content="Eventive Zimbabwe" />
    <meta property="og:title" content="Eventive — Events Logistics & Equipment Hire, Zimbabwe" />
    <meta
      property="og:description"
      content="Marquees, line-array audio, silent generators, catering and crew — owned and operated end to end, nationwide from our Harare hub."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_ZW" />
    <meta property="og:url" content="https://eventive.co.zw/" />
    <meta property="og:image" content="https://eventive.co.zw/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eventive — the full-service events logistics house of Zimbabwe" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eventive — Events Logistics & Equipment Hire, Zimbabwe" />
    <meta
      name="twitter:description"
      content="Marquees, line-array audio, silent generators, catering and crew — owned and operated end to end, nationwide from our Harare hub."
    />
    <meta name="twitter:image" content="https://eventive.co.zw/og-image.png" />

    <!--
      TODO — add "telephone", "priceRange", and a precise "address" once those are
      confirmed; search engines surface them in local results. Everything present
      here is already stated elsewhere on the site.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Eventive Zimbabwe",
        "description": "Full-service events management, equipment hire, and logistics for corporate summits, weddings, Roora celebrations, and private events across Zimbabwe.",
        "url": "https://eventive.co.zw/",
        "email": "events@eventive.co.zw",
        "image": "https://eventive.co.zw/og-image.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Harare",
          "addressCountry": "ZW"
        },
        "areaServed": [
          { "@type": "City", "name": "Harare" },
          { "@type": "City", "name": "Bulawayo" },
          { "@type": "City", "name": "Victoria Falls" },
          { "@type": "City", "name": "Nyanga" },
          { "@type": "Place", "name": "Selous" }
        ],
        "sameAs": ["https://instagram.com/eventive.co.zw"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Events services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Luxury marquees and tent structures" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Sound, lighting and power backup" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile coffee and beverage bars" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Gourmet catering and service crews" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: Georgia, serif; max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; color: #101722;">
        <h1>Eventive Zimbabwe</h1>
        <p>
          Full-service events management, equipment hire, and logistics for corporate summits,
          weddings, Roora celebrations, and private events across Zimbabwe — Harare, Bulawayo,
          Victoria Falls, Nyanga, and Selous.
        </p>
        <p>
          This site needs JavaScript to display fully. To reach us directly, email
          <a href="mailto:events@eventive.co.zw">events@eventive.co.zw</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
