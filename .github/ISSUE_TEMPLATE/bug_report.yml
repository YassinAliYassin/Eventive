name: Bug report
description: Report a problem you encountered
title: "[Bug]: "
labels: ["bug"]
assignees:
  - YassinAliYassin
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behaviour.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please complete the following information.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04]
        - Node version: [e.g. 20]
        - Browser: [e.g. Chrome 120]
        - Version: [e.g. 1.0.0]
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / screenshots
      description: |
        Add any relevant log output or screenshots that help explain the problem.
        Please copy/paste or attach rather than paraphrasing.
      render: shell
