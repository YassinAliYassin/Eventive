version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Avoid disruptive major upgrades until reviewed manually.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
